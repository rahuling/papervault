[package]
name = "papervault"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", features = ["png", "jpeg"] }
lopdf = "0.45.0"
open = "5.4.4"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0
incremental = false
