<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperVault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E7A62'/%3E%3Cpath d='M18 12h22l6 6v34H18z' fill='%23F7F5F0'/%3E%3Cpath d='M40 12v6h6z' fill='%23CFE3DB'/%3E%3Ccircle cx='32' cy='32' r='4.5' fill='%231E7A62'/%3E%3Crect x='30.5' y='35' width='3' height='9' rx='1.5' fill='%231E7A62'/%3E%3C/svg%3E">
<style>
  /* System fonts and inline icons only: the app makes no network requests. */
  :root {
    --bg: #F3F4F6; --panel: #FFFFFF; --side: #FAFAFB; --ink: #1B1F24; --muted: #5F6A76; --faint: #8A94A0;
    --line: #E2E5EA; --line-strong: #C8CED6; --accent: #1E7A62; --accent-ink: #FFFFFF; --accent-soft: #E7F3EF;
    --danger: #B42318; --focus: #2563EB; --shadow: 0 1px 2px rgb(16 24 40 / 6%);
    --sans: "Segoe UI Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101316; --panel: #171B1F; --side: #13171B; --ink: #E9ECEF; --muted: #9AA4AE; --faint: #6B7580;
      --line: #262C33; --line-strong: #3A424B; --accent: #2FA384; --accent-ink: #0B1210; --accent-soft: #15302A;
      --danger: #FF8A80; --focus: #60A5FA;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101316; --panel: #171B1F; --side: #13171B; --ink: #E9ECEF; --muted: #9AA4AE; --faint: #6B7580;
    --line: #262C33; --line-strong: #3A424B; --accent: #2FA384; --accent-ink: #0B1210; --accent-soft: #15302A;
    --danger: #FF8A80; --focus: #60A5FA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  [hidden] { display: none !important; }

  /* Shell: top bar, tool rail, document stage, inspector, status bar */
  .app { height: 100vh; min-height: 600px; display: grid; grid-template-columns: 232px minmax(0, 1fr) 320px; grid-template-rows: 52px minmax(0, 1fr) 28px; grid-template-areas: "top top top" "rail stage insp" "status status status"; }
  .top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
  .brand em { font-style: normal; font-family: var(--serif); font-weight: 400; }
  .docname { color: var(--faint); font-size: 13px; padding-left: 14px; border-left: 1px solid var(--line); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .docname strong { color: var(--ink); font-weight: 600; }
  .spacer { flex: 1; }
  .local { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--accent); font-weight: 600; white-space: nowrap; }

  .rail { grid-area: rail; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 10px 20px; min-height: 0; }
  .search { display: flex; align-items: center; gap: 8px; margin: 2px 4px 6px; padding: 0 10px; height: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--faint); }
  .search input { border: 0; background: transparent; width: 100%; outline: none; font-size: 13px; }
  .section-label { margin: 16px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .nav { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--ink); text-decoration: none; font-size: 13.5px; }
  .nav svg.i { color: var(--muted); }
  .nav:hover { background: rgb(0 0 0 / 4%); }
  .nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav[aria-current="page"] svg.i { color: var(--accent); }
  .nav[hidden] { display: none; }

  /* Stage: the open PDF, the text result, or the empty state */
  .stage { grid-area: stage; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 14px; }
  .app.dragging .stage { outline: 2px dashed var(--accent); outline-offset: -10px; }
  .pdf-view { flex: 1; width: 100%; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); }
  .pdf-fallback { padding: 24px; text-align: center; color: var(--muted); }
  .pdf-fallback a { color: var(--accent); font-weight: 600; }
  .empty-drop { flex: 1; display: grid; place-items: center; align-content: center; gap: 8px; text-align: center; padding: 24px; border: 1.5px dashed var(--line-strong); border-radius: 12px; background: var(--panel); color: var(--muted); }
  .empty-drop h2 { margin: 6px 0 0; font: 400 26px/1.2 var(--serif); color: var(--ink); }
  .empty-drop p { margin: 0 0 10px; max-width: 360px; font-size: 13.5px; }
  .big-icon { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
  .big-icon svg.i { width: 24px; height: 24px; }
  .textview { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .tv-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13px; }
  .tv-text { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 16px; font: 13px/1.55 ui-monospace, Consolas, monospace; white-space: pre-wrap; }

  /* Inspector: the open document, or the options and result of the chosen tool */
  .inspector { grid-area: insp; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 24px; min-height: 0; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .ins-h h2 { margin: 4px 0 6px; font: 400 22px/1.2 var(--serif); }
  .ins-h p { margin: 0; color: var(--muted); font-size: 13px; }
  .ins-sec { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .ins-sec h3 { margin: 0 0 10px; font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
  .ins-sec > p { margin: 0; color: var(--muted); font-size: 13px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .item span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item svg.i { color: var(--muted); width: 16px; height: 16px; }
  .rm { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; display: grid; place-items: center; }
  .rm:hover { color: var(--danger); background: rgb(180 35 24 / 8%); }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field > span { font-size: 12.5px; font-weight: 600; }
  .field small { color: var(--muted); font-size: 12px; }
  input[type=text], input[type=number], input[type=password], select { width: 100%; height: 34px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--panel); outline: none; }
  input:focus, select:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgb(37 99 235 / 15%); }

  button.pick, button.ghost-block { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--panel); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
  button.pick:hover, button.ghost-block:hover { border-color: var(--muted); }
  button.ghost-block { width: 100%; margin-top: 8px; }
  button.primary, a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 38px; border: 0; border-radius: 8px; padding: 0 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; cursor: pointer; text-decoration: none; }
  button.primary:hover:not(:disabled), a.btn:hover { filter: brightness(1.06); }
  button.primary:disabled { background: var(--line-strong); color: var(--muted); cursor: default; }
  .status { margin-top: 10px; font-size: 13px; min-height: 18px; color: var(--muted); }
  .status.err { color: var(--danger); }
  .result { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); }
  .result .ok { display: flex; gap: 8px; align-items: center; font-weight: 600; color: var(--accent); font-size: 13px; }
  .result .fname { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }

  .statusbar { grid-area: status; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .statusbar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .statusbar .spacer { flex: 1; }

  /* Narrower screens: the inspector drops below the stage */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 200px minmax(0, 1fr); grid-template-rows: 52px minmax(420px, 1fr) auto 28px; grid-template-areas: "top top" "rail stage" "rail insp" "status status"; height: auto; min-height: 100vh; }
    .stage { min-height: 70vh; }
    .inspector { border-left: 0; border-top: 1px solid var(--line); max-height: 60vh; }
  }
  /* Phones: everything stacks */
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 52px auto 70vh auto 28px; grid-template-areas: "top" "rail" "stage" "insp" "status"; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 220px; }
    .inspector { max-height: none; }
    .docname, .local span { display: none; }
    .stage { padding: 10px; }
    .empty-drop h2 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <a class="brand" href="#" aria-label="PaperVault viewer">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1E7A62"/><path d="M18 12h22l6 6v34H18z" fill="#F7F5F0"/><path d="M40 12v6h6z" fill="#CFE3DB"/><circle cx="32" cy="32" r="4.5" fill="#1E7A62"/><rect x="30.5" y="35" width="3" height="9" rx="1.5" fill="#1E7A62"/></svg>
      <span>Paper<em>Vault</em></span>
    </a>
    <div class="docname" id="docname">No document open</div>
    <div class="spacer"></div>
    <button type="button" class="pick" data-act="open">Open PDF</button>
    <div class="local" title="Files are processed on this computer and never uploaded">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span>Processed on this computer</span>
    </div>
  </header>

  <nav class="rail" aria-label="Tools" id="rail"></nav>
  <main class="stage" id="stage"></main>
  <aside class="inspector" id="inspector" aria-live="polite"></aside>

  <footer class="statusbar">
    <span class="dot" aria-hidden="true"></span>
    <span>Local processing. No uploads, no accounts, no tracking.</span>
    <span class="spacer"></span>
    <span>PaperVault · MIT licence</span>
  </footer>
  <input type="file" id="picker" hidden>
</div>

<script>
// Icons: 24px line icons drawn in the house style (stroke 1.7, round caps).
const ICON = {
  view: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  merge: '<path d="M4 4h9v13H4z"/><path d="M11 7h9v13h-9z"/>',
  split: '<path d="M4 6v12M20 6v12M4 12h16"/><path d="M9 9l3 3-3 3M15 9l-3 3 3 3"/>',
  extract: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h4"/>',
  delete: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  reorder: '<path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/>',
  rotate: '<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/>',
  crop: '<path d="M6 2v16h16"/><path d="M2 6h16v16"/>',
  compress: '<path d="M4 10l4 4 4-4M4 14l4-4 4 4"/><path d="M20 4v16M16 8l4-4 4 4M16 16l4 4 4-4"/>',
  watermark: '<path d="M4 17c3-6 5-6 8 0s5 6 8 0"/><path d="M4 9h16M4 5h16"/>',
  numbers: '<path d="M5 4h14v16H5z"/><path d="M9 17h6"/><path d="M11 12l1-1v5"/>',
  properties: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  images: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/>',
  imagesToPdf: '<rect x="3" y="4" width="11" height="12" rx="2"/><path d="M7 20h12a2 2 0 0 0 2-2V8"/><path d="m3 13 3-3 4 4"/>',
  text: '<path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h3"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  open: '<path d="M12 4v11M7 9l5-5 5 5M5 20h14"/>',
  back: '<path d="M15 6l-6 6 6 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
};
const svg = (name) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[name] || ICON.info}</svg>`;

// Tools are grouped by the job they do. Tools act on the open document unless "multi" is set.
// "preview" tools show their text result in the stage. "extra" tools need Poppler installed.
const GROUPS = [
  { title: "Organise", tools: [
    { id: "merge", icon: "merge", name: "Merge PDFs", desc: "Join several PDFs into one file.", accept: "application/pdf", multi: true, min: 2, fields: [] },
    { id: "split", icon: "split", name: "Split PDF", desc: "Cut a PDF into smaller files.", accept: "application/pdf", fields: [
        { key: "ranges", label: "Pages for each file", type: "text", placeholder: "1-3, 4-6, 7-", help: "Separate files with commas. An empty end means 'to the last page'." } ] },
    { id: "extract", icon: "extract", name: "Extract pages", desc: "Keep only the pages you pick.", accept: "application/pdf", fields: [
        { key: "pages", label: "Pages to keep", type: "text", placeholder: "1, 3-5", help: "Kept in the order you type them." } ] },
    { id: "delete", icon: "delete", name: "Delete pages", desc: "Remove pages you don't need.", accept: "application/pdf", fields: [
        { key: "pages", label: "Pages to delete", type: "text", placeholder: "2, 7-9" } ] },
    { id: "reorder", icon: "reorder", name: "Reorder pages", desc: "Put pages in a new order.", accept: "application/pdf", fields: [
        { key: "order", label: "New page order", type: "text", placeholder: "3, 1, 2", help: "Unlisted pages are removed." } ] },
    { id: "rotate", icon: "rotate", name: "Rotate pages", desc: "Turn pages sideways or upside down.", accept: "application/pdf", fields: [
        { key: "angle", label: "Rotation", type: "select", options: [["90", "90° clockwise"], ["180", "180°"], ["270", "90° counter-clockwise"]] },
        { key: "pages", label: "Pages", type: "text", placeholder: "Leave empty for all pages" } ] },
    { id: "crop", icon: "crop", name: "Crop margins", desc: "Trim white space from every page.", accept: "application/pdf", fields: [
        { key: "top", label: "Top (points)", type: "number", value: "0" },
        { key: "right", label: "Right (points)", type: "number", value: "0" },
        { key: "bottom", label: "Bottom (points)", type: "number", value: "0" },
        { key: "left", label: "Left (points)", type: "number", value: "0" } ] },
  ]},
  { title: "Optimise", tools: [
    { id: "compress", icon: "compress", name: "Compress PDF", desc: "Reduce file size.", accept: "application/pdf", fields: [
        { key: "level", label: "Size and quality", type: "select", options: [["1200:50", "Smallest file"], ["1600:70", "Balanced (recommended)"], ["2400:85", "Best quality"]] } ] },
  ]},
  { title: "Edit", tools: [
    { id: "watermark", icon: "watermark", name: "Add watermark", desc: "Stamp text across every page.", accept: "application/pdf", fields: [
        { key: "text", label: "Watermark text", type: "text", value: "CONFIDENTIAL" } ] },
    { id: "page-numbers", icon: "numbers", name: "Page numbers", desc: "Number your pages.", accept: "application/pdf", fields: [
        { key: "template", label: "Text", type: "text", value: "{n} of {total}", help: "{n} is the page number, {total} is the total." },
        { key: "position", label: "Position", type: "select", options: [["bottom-center", "Bottom centre"], ["bottom-right", "Bottom right"], ["bottom-left", "Bottom left"], ["top-center", "Top centre"], ["top-right", "Top right"], ["top-left", "Top left"]] } ] },
    { id: "metadata", icon: "properties", name: "Document properties", desc: "Set the title and author.", accept: "application/pdf", fields: [
        { key: "title", label: "Title", type: "text" },
        { key: "author", label: "Author", type: "text" } ] },
  ]},
  { title: "Convert", tools: [
    { id: "pdf-to-images", icon: "images", name: "PDF to images", desc: "Save each page as PNG or JPG.", accept: "application/pdf", extra: true, fields: [
        { key: "format", label: "Format", type: "select", options: [["png", "PNG"], ["jpg", "JPG"]] },
        { key: "dpi", label: "Resolution", type: "select", options: [["150", "Standard (150 dpi)"], ["300", "High (300 dpi)"]] } ],
      note: "Requires Poppler (pdftoppm) on this computer." },
    { id: "images-to-pdf", icon: "imagesToPdf", name: "Images to PDF", desc: "Put photos into one PDF.", accept: "image/*", multi: true, fields: [
        { key: "page_size", label: "Page size", type: "select", options: [["fit", "Fit to each image"], ["a4", "A4"], ["letter", "US Letter"]] } ] },
    { id: "extract-images", icon: "images", name: "Extract images", desc: "Save the pictures inside a PDF.", accept: "application/pdf", fields: [] },
    { id: "to-text", icon: "text", name: "Extract text", desc: "Copy the text out of a PDF.", accept: "application/pdf", fields: [], preview: true },
  ]},
  { title: "Inspect", tools: [
    { id: "info", icon: "info", name: "PDF information", desc: "Page count and document details.", accept: "application/pdf", fields: [], preview: true },
  ]},
];
const TOOLS = GROUPS.flatMap((g) => g.tools.map((t) => ({ ...t, group: g.title })));

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const size = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`);
const isPdf = (f) => f.type === "application/pdf" || /\.pdf$/i.test(f.name);
const accepts = (f, accept) => (accept === "image/*" ? f.type.startsWith("image/") : isPdf(f));

const $ = (id) => document.getElementById(id);
const app = $("app"), rail = $("rail"), stage = $("stage"), inspector = $("inspector"), docname = $("docname"), picker = $("picker");

// One state object drives every region. The open document lives here, so it survives tool changes.
const state = {
  doc: null,        // { file, url }: the open PDF and its blob URL
  tool: null,       // the selected tool, or null for the plain viewer
  queue: [],        // files for multi-file tools
  values: {},       // option values per tool id
  result: null,     // { name, blob, url, size } from the last run
  text: "",         // text result shown in the stage
  textId: 0,        // changes whenever text changes, so the stage knows to redraw
  stage: "pdf",     // "pdf" or "text"
  status: null,     // { text, err } message under the Run button
  busy: false,
};

// Blob URLs are released as soon as the thing they point to is replaced.
function setDoc(file) {
  if (state.doc) URL.revokeObjectURL(state.doc.url);
  state.doc = { file, url: URL.createObjectURL(new Blob([file], { type: "application/pdf" })) };
  dropResult();
  state.stage = "pdf";
  state.status = null;
  render();
}
function closeDoc() {
  if (state.doc) URL.revokeObjectURL(state.doc.url);
  state.doc = null;
  dropResult();
  state.stage = "pdf";
  render();
}
function dropResult() {
  if (state.result) URL.revokeObjectURL(state.result.url);
  state.result = null;
}

// Files arrive from the picker, the drop zone, or the empty state. Routing depends on the selected tool.
function handleFiles(files, mode) {
  const list = Array.from(files);
  const tool = state.tool;
  if (mode === "queue" && tool && tool.multi) {
    const ok = list.filter((f) => accepts(f, tool.accept));
    if (!ok.length) return showStatus(tool.accept === "image/*" ? "Pick image files for this tool." : "Pick PDF files for this tool.", true);
    state.queue = state.queue.concat(ok);
    dropResult();
    state.status = null;
    return render();
  }
  const pdf = list.find(isPdf);
  if (!pdf) return showStatus("Only PDF files can be opened here.", true);
  setDoc(pdf);
}
function showStatus(text, err) {
  state.status = { text, err: !!err };
  render();
}
function openPicker(mode) {
  const tool = state.tool;
  if (mode === "queue" && tool && tool.multi) {
    picker.accept = tool.accept;
    picker.multiple = true;
  } else {
    mode = "doc";
    picker.accept = "application/pdf";
    picker.multiple = false;
  }
  picker.dataset.mode = mode;
  picker.value = "";
  picker.click();
}
picker.addEventListener("change", () => handleFiles(picker.files, picker.dataset.mode));

// Drop a file anywhere in the window.
document.addEventListener("dragover", (e) => { e.preventDefault(); app.classList.add("dragging"); });
document.addEventListener("dragleave", (e) => { if (!e.relatedTarget) app.classList.remove("dragging"); });
document.addEventListener("drop", (e) => {
  e.preventDefault();
  app.classList.remove("dragging");
  handleFiles(e.dataTransfer.files, state.tool && state.tool.multi ? "queue" : "doc");
});

// Every button in the app is handled here.
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "open") openPicker("doc");
  else if (act === "add") openPicker("queue");
  else if (act === "close") closeDoc();
  else if (act === "run") run();
  else if (act === "use-result") useResult();
  else if (act === "back") { state.stage = "pdf"; render(); }
  else if (act === "rm-queue") { state.queue.splice(Number(el.dataset.i), 1); dropResult(); render(); }
});

// Option values are stored as the user types, so re-rendering never loses them.
const valueOf = (tool, f) => {
  const saved = state.values[tool.id];
  if (saved && f.key in saved) return saved[f.key];
  return f.value ?? (f.options ? f.options[0][0] : "");
};
inspector.addEventListener("input", (e) => {
  const key = e.target.dataset.key;
  if (key && state.tool) (state.values[state.tool.id] ||= {})[key] = e.target.value;
});
inspector.addEventListener("change", (e) => {
  const key = e.target.dataset.key;
  if (key && state.tool) (state.values[state.tool.id] ||= {})[key] = e.target.value;
});

function canRun() {
  const tool = state.tool;
  if (!tool || state.busy) return false;
  return tool.multi ? state.queue.length >= (tool.min || 1) : !!state.doc;
}

async function run() {
  const tool = state.tool;
  if (!canRun()) return;
  const form = new FormData();
  const files = tool.multi ? state.queue : [state.doc.file];
  files.forEach((f) => form.append("file", f, f.name));
  for (const f of tool.fields) {
    const value = String(valueOf(tool, f)).trim();
    if (f.key === "level") {
      const [max_side, quality] = value.split(":");
      form.append("max_side", max_side); form.append("quality", quality);
    } else if (value !== "") {
      form.append(f.key, value);
    }
  }
  state.busy = true;
  state.status = { text: "Working…", err: false };
  render();
  try {
    const res = await fetch(`/api/run/${tool.id}`, { method: "POST", body: form });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Something went wrong (${res.status}).`);
    }
    const blob = await res.blob();
    const name = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "")?.[1] || "result";
    dropResult();
    state.result = { name, blob, size: blob.size, url: URL.createObjectURL(blob) };
    state.status = { text: "Done.", err: false };
    if (tool.preview) {
      state.text = await blob.text();
      state.textId++;
      state.stage = "text";
    }
  } catch (err) {
    state.status = { text: err.message, err: true };
  } finally {
    state.busy = false;
    render();
  }
}

// A PDF result becomes the open document, so tools can be chained: rotate, then compress, and so on.
function useResult() {
  const r = state.result;
  if (!r) return;
  setDoc(new File([r.blob], r.name, { type: "application/pdf" }));
}

// Rail: the viewer, then every tool. Built once so the search box keeps its text.
function buildRail() {
  rail.innerHTML = `
    <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:15px;height:15px"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Find a tool" aria-label="Find a tool"></label>
    <div class="section-label">Read</div>
    <a class="nav" href="#" data-id="">${svg("view")}<span>Viewer</span></a>
    ${GROUPS.map((g) => `
      <div class="nav-group">
        <div class="section-label">${esc(g.title)}</div>
        ${g.tools.map((t) => `<a class="nav" href="#${t.id}" data-id="${t.id}" data-search="${esc((t.name + " " + t.desc).toLowerCase())}">${svg(t.icon)}<span>${esc(t.name)}</span></a>`).join("")}
      </div>`).join("")}`;
  $("q").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    rail.querySelectorAll("a.nav[data-search]").forEach((a) => { a.hidden = q !== "" && !a.dataset.search.includes(q); });
    rail.querySelectorAll(".nav-group").forEach((g) => { g.hidden = [...g.querySelectorAll("a.nav")].every((a) => a.hidden); });
  });
}
function markRail() {
  const current = state.tool ? state.tool.id : "";
  rail.querySelectorAll("a.nav[data-id]").forEach((a) => {
    if (a.dataset.id === current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

// The stage is only redrawn when what it shows changes. Redrawing the PDF object would reload the file.
let stageKey = "";
function renderStage() {
  const key = `${state.stage}|${state.doc ? state.doc.url : ""}|${state.textId}`;
  if (key === stageKey) return;
  stageKey = key;
  if (state.stage === "text") {
    stage.innerHTML = `
      <div class="textview">
        <div class="tv-bar"><span>Text result</span><button type="button" class="pick" data-act="back">${svg("back")} Back to document</button></div>
        <pre class="tv-text">${esc(state.text)}</pre>
      </div>`;
  } else if (state.doc) {
    const name = esc(state.doc.file.name);
    stage.innerHTML = `
      <object class="pdf-view" data="${state.doc.url}#toolbar=1" type="application/pdf" aria-label="${name}">
        <div class="pdf-fallback">This browser cannot show PDFs here. <a href="${state.doc.url}" download="${name}">Download ${name}</a> and open it in a PDF reader.</div>
      </object>`;
  } else {
    stage.innerHTML = `
      <div class="empty-drop">
        <span class="big-icon">${svg("view")}</span>
        <h2>Open a PDF</h2>
        <p>Drop a file anywhere on this page, or choose one. It is shown here and never uploaded.</p>
        <button type="button" class="primary" data-act="open" style="width:auto;padding:0 22px">Choose a PDF</button>
      </div>`;
  }
}

function fieldHtml(tool, f) {
  const v = valueOf(tool, f);
  const input = f.type === "select"
    ? `<select data-key="${f.key}">${f.options.map(([val, label]) => `<option value="${esc(val)}"${String(val) === String(v) ? " selected" : ""}>${esc(label)}</option>`).join("")}</select>`
    : `<input data-key="${f.key}" type="${f.type}" value="${esc(v)}" placeholder="${esc(f.placeholder ?? "")}">`;
  return `<label class="field"><span>${esc(f.label)}</span>${input}${f.help ? `<small>${esc(f.help)}</small>` : ""}</label>`;
}

function renderInspector() {
  const tool = state.tool;
  if (!tool) {
    inspector.innerHTML = `
      <div class="ins-h">
        <div class="kicker">Document</div>
        <h2>${state.doc ? esc(state.doc.file.name) : "Nothing open"}</h2>
        <p>${state.doc ? size(state.doc.file.size) + ". Choose a tool on the left to work on it. Results open back here." : "Open a PDF to read it. Then choose a tool on the left to change it."}</p>
      </div>
      <div class="ins-sec">
        ${state.doc
          ? `<button type="button" class="ghost-block" data-act="open">${svg("open")} Open another PDF</button>
             <button type="button" class="ghost-block" data-act="close">${svg("close")} Close document</button>`
          : `<button type="button" class="primary" data-act="open">Choose a PDF</button>`}
      </div>`;
    return;
  }

  let input;
  if (tool.multi) {
    const rows = state.queue.map((f, i) => `
      <div class="item">${svg("extract")}<span>${esc(f.name)}</span>
        <button type="button" class="rm" data-act="rm-queue" data-i="${i}" aria-label="Remove ${esc(f.name)}">${svg("delete")}</button></div>`).join("");
    input = `
      ${rows || `<p>No files yet. Add ${tool.accept === "image/*" ? "images" : "PDFs"} to start.</p>`}
      <button type="button" class="ghost-block" data-act="add">${svg("open")} Add ${tool.accept === "image/*" ? "images" : "PDFs"}</button>
      ${tool.min && state.queue.length < tool.min ? `<p style="margin-top:8px;font-size:12.5px">Add at least ${tool.min} files.</p>` : ""}`;
  } else {
    input = state.doc
      ? `<div class="item">${svg("extract")}<span>${esc(state.doc.file.name)}</span></div>
         <p style="font-size:12.5px">This tool works on the open document.</p>`
      : `<p>Open a PDF first. This tool works on the open document.</p>
         <button type="button" class="ghost-block" data-act="open">${svg("open")} Open a PDF</button>`;
  }

  const fields = tool.fields.length
    ? tool.fields.map((f) => fieldHtml(tool, f)).join("")
    : `<p style="margin:0">No options for this tool.</p>`;

  const r = state.result;
  const result = r ? `
    <section class="ins-sec">
      <h3>Result</h3>
      <div class="result">
        <div class="ok">${svg("check")} Ready · ${size(r.size)}</div>
        <div class="fname">${esc(r.name)}</div>
        <a class="btn" href="${r.url}" download="${esc(r.name)}">${svg("download")} Download</a>
        ${/\.pdf$/i.test(r.name) ? `<button type="button" class="ghost-block" data-act="use-result" style="margin-top:0">${svg("view")} Open result in viewer</button>` : ""}
      </div>
    </section>` : "";

  const status = state.status ? `<div class="status ${state.status.err ? "err" : ""}" role="status">${esc(state.status.text)}</div>` : "";

  inspector.innerHTML = `
    <div class="ins-h">
      <div class="kicker">${esc(tool.group)}</div>
      <h2>${esc(tool.name)}</h2>
      <p>${esc(tool.desc)}${tool.note ? ` ${esc(tool.note)}` : ""}</p>
    </div>
    <section class="ins-sec"><h3>${tool.multi ? "Files" : "Input"}</h3>${input}</section>
    <section class="ins-sec"><h3>Options</h3>${fields}</section>
    <section class="ins-sec">
      <button type="button" class="primary" data-act="run" ${canRun() ? "" : "disabled"}>${esc(tool.name)}</button>
      ${status}
    </section>
    ${result}`;
}

function render() {
  const tool = state.tool;
  document.title = state.doc ? `${state.doc.file.name} · PaperVault` : tool ? `${tool.name} · PaperVault` : "PaperVault";
  docname.innerHTML = state.doc ? `<strong>${esc(state.doc.file.name)}</strong>` : "No document open";
  markRail();
  renderStage();
  renderInspector();
}

// The URL hash picks the tool. No hash is the viewer.
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const next = TOOLS.find((t) => t.id === id) || null;
  if (next !== state.tool) {
    state.tool = next;
    state.queue = [];
    dropResult();
    state.status = null;
    state.stage = "pdf";
  }
  render();
}
window.addEventListener("hashchange", route);
buildRail();
route();
</script>
</body>
</html>
